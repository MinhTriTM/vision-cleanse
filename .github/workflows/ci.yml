name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[charts] "coverage[toml]" ruff
      - name: Tests with coverage
        run: coverage run -m unittest discover -s tests && coverage xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
      - name: Lint
        run: ruff check src tests benchmarks
      - name: Type check (non-blocking until public API is fully typed)
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/vision_cleanse --ignore-missing-imports

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run near-duplicate benchmark
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python benchmarks/benchmark_near_dup.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results_near_dup.json
