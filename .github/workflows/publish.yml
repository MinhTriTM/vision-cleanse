name: Publish to PyPI

# Publishes on every published GitHub release, or manually.
# Uses PyPI trusted publishing (OIDC): no API token in secrets.
# One-time setup on PyPI (see docs/publishing.md): add a pending
# trusted publisher for this repo with workflow filename "publish.yml".
# The version to publish is bumped in pyproject.toml + __init__.py
# before creating the release (strategy: first PyPI release = 0.3.0).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
