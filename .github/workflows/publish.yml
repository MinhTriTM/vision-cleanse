name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài đặt dependencies kiểm thử
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Chạy toàn bộ Pytest
        run: |
          pytest -v

      - name: Đóng gói sdist và wheel
        run: |
          pip install build
          python -m build

      - name: Xuất bản lên PyPI qua Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
