[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-cleanse"
version = "0.2.0"
description = "Clean near-duplicates and train/val/test leakage from computer vision datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VisionCleanse Contributors" }]
keywords = ["computer-vision", "dataset", "deduplication", "data-leakage", "phash", "dhash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "Pillow>=9.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = []
docs = ["mkdocs>=1.6", "mkdocs-material>=9"]
charts = ["matplotlib>=3.7"]

[tool.ruff]
target-version = "py310"

[tool.coverage.run]
source = ["src"]

[project.scripts]
vision-cleanse = "vision_cleanse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
